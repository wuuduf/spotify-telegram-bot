name: spotify-telegram-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: wuuduf/spotify-telegram-bot:latest
    container_name: spotify-telegram-bot
    restart: unless-stopped
    environment:
      # 直接改这里的 token 即可
      TELEGRAM_BOT_TOKEN: "123456789:replace_me"
      TZ: "Asia/Shanghai"
    volumes:
      # 写死路径：本地文件 -> 容器内路径
      - ./docker/config/spotify_bot.config.toml:/config/spotify_bot.config.toml:ro
      - ./docker/config/config.ini:/config/config.ini:ro
      # 用户只需把 cookies / wvd 放在仓库根目录
      - ./cookies.txt:/config/cookies.txt:ro
      - ./device.wvd:/config/device.wvd:ro
      - ./docker/data:/data
    command:
      [
        "python",
        "-m",
        "votify.spotify_telegram_bot.main",
        "--config",
        "/config/spotify_bot.config.toml",
        "--log-level",
        "INFO"
      ]
